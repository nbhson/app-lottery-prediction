name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        # Không cần env: AI_API_KEY là optional (thiếu → AI disabled, build vẫn pass)

  docker:
    runs-on: ubuntu-latest
    needs: ci # chỉ build image khi test đã pass

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Xác minh Dockerfile build được (không push) — image dùng cho deploy
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: vietlott-prediction:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
